# Configurações para ambiente de test

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # O console web é registrado em H2ConsoleTestConfig (Spring Boot 4 não lê
  # spring.h2.console.*); acessível em http://localhost:8080/h2-console/

  sql:
    init:
      mode: always

# Configuração MinIO (pode usar mock ou testcontainers)
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: livros-test

logging:
  level:
    com.pedroMartinsMJ.bibliotecaPedroMJ: DEBUG
    org.springframework.security: DEBUG

# Chaves JWT dummy para testes
jwt:
  public:
    key: test-public-key
  private:
    key: test-private-key

# Chave de criptografia para testes (AES-256)
app:
  # true mantem o @PreAuthorize valendo, como a suíte unitária espera. O launcher
  # do modo teste injeta APP_TESTE_METODO_SEGURANCA=false para o dev abrir as
  # páginas de ADMIN sem login.
  teste:
    metodo-seguranca: true
  encryption:
    key: "+s5G3B9/iucZjUV4HVie1BQgj8M6/2bquV82hLszU78="

# Observabilidade com Actuator em Testes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump