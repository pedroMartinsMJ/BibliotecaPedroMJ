spring:
  application:
    name: bibliotecaPedroMJ

  profiles:
    active: test

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    mode: HTML
    encoding: UTF-8

  # Configuração PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteca_db
    username: ${DB_USERNAME:pedro}
    password: ${DB_PASSWORD:senha123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  sql:
    init:
      mode: always

  mvc:
    static-path-pattern: /**

  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id:  ${GOOGLE_CLIENT_ID}
            client-secret:  ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

jwt:
  private:
    key: ${JWT_PRIVATE_KEY:classpath:app.key}
  public:
    key: ${JWT_PUBLIC_KEY:classpath:app.pub}

# Configuração MinIO (Custom)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET_NAME:livros}

