spring:
  application:
    name: bibliotecaPedroMJ

  profiles:
    active: test

  # Habilita Virtual Threads (Java 21 / Project Loom)
  threads:
    virtual:
      enabled: true

  # Configuração PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteca_db
    username: ${DB_USERNAME:pedro}
    password: ${DB_PASSWORD:senha123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: BibliotecaHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      # precisa acompanhar app.upload.limite-arquivo-mb: o container corta a
      # requisição antes de chegar ao InspecionadorDeArquivo
      max-file-size: 50MB
      max-request-size: 50MB

  sql:
    init:
      mode: always

  mvc:
    static-path-pattern: /**

  web:
    resources:
      static-locations: classpath:/static/, classpath:/static/browser/
      cache:
        period: 0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id:  ${GOOGLE_CLIENT_ID}
            client-secret:  ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

jwt:
  private:
    key: ${JWT_PRIVATE_KEY:classpath:app.key}
  public:
    key: ${JWT_PUBLIC_KEY:classpath:app.pub}

# Chave de criptografia para dados sensíveis (AES-256)
# Gere com: openssl rand -base64 32
app:
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
  upload:
    limite-arquivo-mb: 50
    limite-capa-mb: 5

# Configuração MinIO (Custom)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET_NAME:livros}
  # links pré-assinados: tempo curto porque a URL exposta vira credencial de acesso
  url-expiracao-minutos: 15

# Observabilidade com Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    enable:
      jvm: true
      hikaricp: true
      process: true

# ddl-auto: create-drop
# ddl-auto: none